name: CloudIPA iOS Build

run-name: "CloudIPA Build [${{ inputs.request_id }}] (${{ inputs.scheme || 'auto' }})"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique build correlation ID'
        required: true
        type: string
      project_path:
        description: 'Path to iOS project root directory'
        required: false
        default: '.'
        type: string
      scheme:
        description: 'Xcode scheme name to compile'
        required: false
        default: ''
        type: string
      configuration:
        description: 'Build configuration (Release/Debug)'
        required: false
        default: 'Release'
        type: string
      runner:
        description: 'GitHub-hosted macOS runner label'
        required: false
        default: 'macos-15'
        type: string
      xcode_version:
        description: 'Xcode version to select (e.g. 16.0, 15.4) or auto'
        required: false
        default: 'auto'
        type: string
      artifact_name:
        description: 'Base name of generated IPA'
        required: false
        default: 'App'
        type: string

permissions:
  contents: read

concurrency:
  group: cloudipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-unsigned-ipa:
    name: Build Unsigned IPA
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        if: ${{ inputs.xcode_version != '' && inputs.xcode_version != 'auto' }}
        run: |
          XCODE_PATH="/Applications/Xcode_${{ inputs.xcode_version }}.app"
          if [ -d "$XCODE_PATH" ]; then
            echo "Selecting Xcode version: ${{ inputs.xcode_version }}"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          else
            echo "Requested Xcode $XCODE_PATH not found; listing installed Xcode versions:"
            ls -d /Applications/Xcode*.app || true
            echo "Falling back to default system Xcode"
          fi
          xcodebuild -version

      - name: Resolve Project & Scheme
        id: resolve
        run: |
          set -euo pipefail
          TARGET_DIR="${{ inputs.project_path }}"
          cd "$TARGET_DIR"

          WORKSPACE_FILE=$(find . -maxdepth 2 -name "*.xcworkspace" ! -name "project.xcworkspace" | head -n 1 || true)
          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1 || true)

          BUILD_CONTAINER_FLAG=""
          if [ -n "$WORKSPACE_FILE" ]; then
            echo "Found workspace: $WORKSPACE_FILE"
            BUILD_CONTAINER_FLAG="-workspace $WORKSPACE_FILE"
          elif [ -n "$PROJECT_FILE" ]; then
            echo "Found project: $PROJECT_FILE"
            BUILD_CONTAINER_FLAG="-project $PROJECT_FILE"
          else
            echo "::error::No .xcworkspace or .xcodeproj found in $TARGET_DIR"
            exit 1
          fi

          SCHEME="${{ inputs.scheme }}"
          if [ -z "$SCHEME" ]; then
            echo "Scheme not provided. Querying available schemes via xcodebuild -list -json..."
            LIST_JSON=$(xcodebuild $BUILD_CONTAINER_FLAG -list -json || true)
            SCHEME=$(echo "$LIST_JSON" | grep -A 20 '"schemes"' | grep -v '"schemes"' | tr -d '", ' | head -n 1 || true)
            if [ -z "$SCHEME" ]; then
              SCHEME=$(echo "$LIST_JSON" | grep -A 20 '"targets"' | grep -v '"targets"' | tr -d '", ' | head -n 1 || true)
            fi
            echo "Auto-detected scheme: $SCHEME"
          fi

          if [ -z "$SCHEME" ]; then
            echo "::error::Could not determine an Xcode scheme to build."
            exit 1
          fi

          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "container_flag=$BUILD_CONTAINER_FLAG" >> "$GITHUB_OUTPUT"
          echo "target_dir=$TARGET_DIR" >> "$GITHUB_OUTPUT"

      - name: Compile Unsigned iOS Application
        id: compile
        run: |
          set -euo pipefail
          TARGET_DIR="${{ steps.resolve.outputs.target_dir }}"
          SCHEME="${{ steps.resolve.outputs.scheme }}"
          CONTAINER_FLAG="${{ steps.resolve.outputs.container_flag }}"
          CONFIG="${{ inputs.configuration }}"
          DERIVED_DIR="$RUNNER_TEMP/cloudipa-derived"
          mkdir -p "$DERIVED_DIR"

          cd "$TARGET_DIR"
          echo "Building scheme '$SCHEME' [Configuration: $CONFIG] in $TARGET_DIR..."

          xcodebuild build \
            $CONTAINER_FLAG \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO | tee "$RUNNER_TEMP/build.log"

          PRODUCTS_DIR="$DERIVED_DIR/Build/Products/${CONFIG}-iphoneos"
          APP_PATH=$(find "$PRODUCTS_DIR" -maxdepth 2 -name "*.app" -type d | head -n 1 || true)

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Compiled .app bundle not found in $PRODUCTS_DIR"
            exit 1
          fi

          echo "Successfully compiled .app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package Unsigned IPA & Extract Metadata
        id: package
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.compile.outputs.app_path }}"
          STAGE_DIR="$RUNNER_TEMP/ipa-stage"
          PAYLOAD_DIR="$STAGE_DIR/Payload"
          OUTPUT_IPA="$RUNNER_TEMP/${{ inputs.artifact_name }}.unsigned.ipa"
          INFO_PLIST="$APP_PATH/Info.plist"

          rm -rf "$STAGE_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          # Read App Metadata
          BUNDLE_ID="Unknown"
          VERSION="Unknown"
          BUILD_NUM="Unknown"
          DISPLAY_NAME="Unknown"

          if [ -f "$INFO_PLIST" ]; then
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST" 2>/dev/null || echo "Unknown")
            VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST" 2>/dev/null || echo "Unknown")
            BUILD_NUM=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST" 2>/dev/null || echo "Unknown")
            DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$INFO_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$INFO_PLIST" 2>/dev/null || echo "Unknown")
          fi

          echo "Packaging .ipa..."
          cd "$STAGE_DIR"
          zip -r9 -y "$OUTPUT_IPA" Payload

          echo "Validating ZIP integrity..."
          unzip -t "$OUTPUT_IPA"

          # Verify Payload/*.app/Info.plist is inside the archive
          if ! unzip -l "$OUTPUT_IPA" | grep -E "Payload/[^/]+\.app/Info\.plist" >/dev/null; then
            echo "::error::Integrity check failed: Payload/*.app/Info.plist missing from generated IPA."
            exit 1
          fi

          SHA256=$(shasum -a 256 "$OUTPUT_IPA" | awk '{print $1}')
          IPA_SIZE=$(stat -f %z "$OUTPUT_IPA" 2>/dev/null || wc -c < "$OUTPUT_IPA")

          cat <<EOF > "$RUNNER_TEMP/build-info.json"
          {
            "requestId": "${{ inputs.request_id }}",
            "scheme": "${{ steps.resolve.outputs.scheme }}",
            "configuration": "${{ inputs.configuration }}",
            "bundleIdentifier": "$BUNDLE_ID",
            "displayName": "$DISPLAY_NAME",
            "version": "$VERSION",
            "buildNumber": "$BUILD_NUM",
            "sha256": "$SHA256",
            "sizeBytes": $IPA_SIZE,
            "createdAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "runner": "${{ inputs.runner }}"
          }
          EOF

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "ipa_path=$OUTPUT_IPA" >> "$GITHUB_OUTPUT"

      - name: Upload Unsigned IPA & Metadata
        uses: actions/upload-artifact@v4
        with:
          name: cloudipa-artifact-${{ inputs.request_id }}
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ runner.temp }}/build-info.json
            ${{ runner.temp }}/build.log
          retention-days: 7
