name: CloudIPA iOS Build

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique build request identifier'
        required: true
        type: string
      project_path:
        description: 'Relative path to Xcode project or workspace'
        required: false
        default: '.'
        type: string
      archive_url:
        description: 'Signed URL to fetch uploaded project archive'
        required: false
        default: ''
        type: string
      scheme:
        description: 'Xcode build scheme'
        required: false
        default: ''
        type: string
      configuration:
        description: 'Build configuration (Release or Debug)'
        required: false
        default: 'Release'
        type: string
      runner:
        description: 'macOS runner label'
        required: false
        default: 'macos-15'
        type: string
      xcode_version:
        description: 'Specific Xcode version or auto'
        required: false
        default: 'auto'
        type: string
      artifact_name:
        description: 'Output artifact base name'
        required: false
        default: 'App'
        type: string

concurrency:
  group: cloudipa-${{ github.workflow }}-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Build Unsigned iOS Application
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch Uploaded Web Studio Archive
        if: ${{ inputs.archive_url != '' }}
        env:
          INPUT_ARCHIVE_URL: ${{ inputs.archive_url }}
          INPUT_PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          WORKSPACE_DIR="$RUNNER_TEMP/workspace"
          mkdir -p "$WORKSPACE_DIR"
          echo "Downloading project archive from signed URL..."
          curl -fsSL "$INPUT_ARCHIVE_URL" -o "$RUNNER_TEMP/upload.zip"
          unzip -q -o "$RUNNER_TEMP/upload.zip" -d "$WORKSPACE_DIR"
          rm -rf "$WORKSPACE_DIR/__MACOSX"
          find "$WORKSPACE_DIR" -name ".DS_Store" -delete 2>/dev/null || true
          echo "Project archive successfully unpacked into $WORKSPACE_DIR"

      - name: Select Xcode Version
        if: ${{ inputs.xcode_version != '' && inputs.xcode_version != 'auto' }}
        env:
          INPUT_XCODE_VERSION: ${{ inputs.xcode_version }}
        run: |
          XCODE_PATH="/Applications/Xcode_${INPUT_XCODE_VERSION}.app"
          if [ -d "$XCODE_PATH" ]; then
            echo "Selecting Xcode version: $INPUT_XCODE_VERSION"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          else
            echo "Requested Xcode $XCODE_PATH not found; listing installed Xcode versions:"
            ls -d /Applications/Xcode*.app || true
            echo "Falling back to default system Xcode"
          fi
          xcodebuild -version

      - name: Resolve Project & Scheme
        id: resolve
        env:
          INPUT_SCHEME: ${{ inputs.scheme }}
          INPUT_CONFIG: ${{ inputs.configuration }}
        run: |
          set -euo pipefail
          SEARCH_DIR="$RUNNER_TEMP/workspace"
          [ -d "$SEARCH_DIR" ] || SEARCH_DIR="."
          cd "$SEARCH_DIR"
          rm -rf __MACOSX 2>/dev/null || true

          PROJECT_FILE=$(find . -name "*.xcodeproj" ! -path "*/node_modules/*" ! -path "*/Pods/*" ! -path "*/Carthage/*" ! -path "*/.build/*" ! -path "*/__MACOSX/*" \
            | awk -F'/' '{print NF, $0}' | sort -n | head -n 1 | cut -d' ' -f2- || true)
          WORKSPACE_FILE=$(find . -name "*.xcworkspace" ! -path "*.xcodeproj/*" ! -path "*/node_modules/*" ! -path "*/Pods/*" ! -path "*/Carthage/*" ! -path "*/__MACOSX/*" \
            | awk -F'/' '{print NF, $0}' | sort -n | head -n 1 | cut -d' ' -f2- || true)

          if [ -z "$WORKSPACE_FILE" ] && [ -z "$PROJECT_FILE" ]; then
            echo "::error::[PROJECT_ERROR] No Xcode project (.xcodeproj) or workspace (.xcworkspace) found." | tee "$RUNNER_TEMP/build.log"
            exit 1
          fi

          WORK_DIR=$(dirname "${WORKSPACE_FILE:-$PROJECT_FILE}")
          cd "$WORK_DIR"

          if [ -f "Podfile" ] && { [ ! -d "Pods" ] || ! cmp -s Podfile.lock Pods/Manifest.lock 2>/dev/null; }; then
            echo "Podfile detected with missing/outdated Pods; running pod install..."
            pod install --repo-update || pod install || true
            WORKSPACE_FILE=$(find . -maxdepth 1 -name "*.xcworkspace" ! -path "*.xcodeproj/*" | head -n 1 || true)
          fi

          PROJ_BASE=$( [ -n "$PROJECT_FILE" ] && basename "$PROJECT_FILE" || echo "" )
          PROJ_JSON=$( [ -n "$PROJ_BASE" ] && [ -d "$PROJ_BASE" ] && xcodebuild -project "$PROJ_BASE" -list -json 2>/dev/null || echo "{}" )

          if [ -n "$WORKSPACE_FILE" ]; then
            CONTAINER_TYPE="-workspace"; CONTAINER_PATH=$(basename "$WORKSPACE_FILE")
          else
            CONTAINER_TYPE="-project"; CONTAINER_PATH=$(basename "$PROJECT_FILE")
          fi

          LIST_JSON=$(xcodebuild "$CONTAINER_TYPE" "$CONTAINER_PATH" -list -json 2>/dev/null || echo "{}")
          SCHEME=$(jq -rn --arg req "$INPUT_SCHEME" --argjson ws "$LIST_JSON" --argjson pr "$PROJ_JSON" '
            (($pr.project.schemes // []) + ($pr.project.targets // [])) as $appCandidates |
            (($ws.workspace.schemes // []) + ($ws.project.schemes // []) + $appCandidates)
            | map(select(. != null and . != "" and (test("^(Pods-|Pods_)") | not) and (test("(Tests|UITests)$") | not))) as $filtered |
            if ($req != "" and ($filtered | index($req))) then $req
            elif (($appCandidates | map(select((test("(Tests|UITests)$") | not))) | length) > 0) then
              ($appCandidates | map(select((test("(Tests|UITests)$") | not)))[0])
            else ($filtered[0] // empty) end
          ')

          [ -n "$SCHEME" ] || { echo "::error::[PROJECT_ERROR] No buildable application scheme or target found in Xcode project." | tee "$RUNNER_TEMP/build.log"; exit 1; }

          # Validate configuration exists, fallback to first available if custom-named
          CONFIG="$INPUT_CONFIG"
          AVAILABLE_CONFIGS=$(echo "$LIST_JSON" | jq -r '(.workspace.configurations // .project.configurations // [])[]' 2>/dev/null || true)
          if [ -n "$AVAILABLE_CONFIGS" ] && ! echo "$AVAILABLE_CONFIGS" | grep -qx "$CONFIG"; then
            FALLBACK_CONFIG=$(echo "$AVAILABLE_CONFIGS" | head -n 1)
            if [ -n "$FALLBACK_CONFIG" ]; then
              echo "Requested configuration '$CONFIG' not found; using project configuration '$FALLBACK_CONFIG'"
              CONFIG="$FALLBACK_CONFIG"
            fi
          fi

          echo "Target scheme resolved to: $SCHEME (Configuration: $CONFIG)"
          echo "Working directory: $(pwd)"

          {
            echo "scheme=$SCHEME"
            echo "container_type=$CONTAINER_TYPE"
            echo "container_path=$CONTAINER_PATH"
            echo "target_dir=$(pwd)"
            echo "config=$CONFIG"
          } >> "$GITHUB_OUTPUT"

      - name: Compile Unsigned iOS Application
        id: compile
        env:
          TARGET_DIR: ${{ steps.resolve.outputs.target_dir }}
          SCHEME: ${{ steps.resolve.outputs.scheme }}
          CONTAINER_TYPE: ${{ steps.resolve.outputs.container_type }}
          CONTAINER_PATH: ${{ steps.resolve.outputs.container_path }}
          CONFIG: ${{ steps.resolve.outputs.config }}
        run: |
          set -uo pipefail
          DERIVED_DIR="$RUNNER_TEMP/cloudipa-derived"
          mkdir -p "$DERIVED_DIR"

          cd "$TARGET_DIR"
          echo "Building scheme '$SCHEME' [Configuration: $CONFIG] in $TARGET_DIR..."

          set +e
          xcodebuild build \
            "$CONTAINER_TYPE" "$CONTAINER_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO | tee "$RUNNER_TEMP/build.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_EXIT -ne 0 ] && grep -q -i -E "(entitlements|provisioning profile)" "$RUNNER_TEMP/build.log"; then
            echo "Initial build failed on entitlements/provisioning; retrying with CODE_SIGN_ENTITLEMENTS=\"\"..."
            set +e
            xcodebuild build \
              "$CONTAINER_TYPE" "$CONTAINER_PATH" \
              -scheme "$SCHEME" \
              -configuration "$CONFIG" \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$DERIVED_DIR" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              PROVISIONING_PROFILE_SPECIFIER="" \
              PROVISIONING_PROFILE="" \
              DEVELOPMENT_TEAM="" \
              CODE_SIGN_ENTITLEMENTS="" \
              -skipMacroValidation \
              -skipPackagePluginValidation \
              COMPILER_INDEX_STORE_ENABLE=NO | tee "$RUNNER_TEMP/build.log"
            BUILD_EXIT=${PIPESTATUS[0]}
            set -e
          fi

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::xcodebuild compilation failed with exit code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi

          PRODUCTS_DIR="$DERIVED_DIR/Build/Products/${CONFIG}-iphoneos"
          APP_PATH=$(find "$PRODUCTS_DIR" -maxdepth 1 -name "*.app" -type d | head -n 1 || true)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$PRODUCTS_DIR" -name "*.app" ! -path "*.app/*" -type d | head -n 1 || true)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Compiled .app bundle not found in $PRODUCTS_DIR"
            exit 1
          fi

          echo "Successfully compiled .app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package Unsigned IPA & Extract Metadata
        id: package
        env:
          APP_PATH: ${{ steps.compile.outputs.app_path }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          REQUEST_ID: ${{ inputs.request_id }}
          SCHEME: ${{ steps.resolve.outputs.scheme }}
          CONFIG: ${{ steps.resolve.outputs.config }}
          RUNNER_LABEL: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          STAGE_DIR="$RUNNER_TEMP/ipa-stage"
          PAYLOAD_DIR="$STAGE_DIR/Payload"
          OUTPUT_IPA="$RUNNER_TEMP/${ARTIFACT_NAME}.unsigned.ipa"
          INFO_PLIST="$APP_PATH/Info.plist"

          rm -rf "$STAGE_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          BUNDLE_ID="Unknown"; VERSION="Unknown"; BUILD_NUM="Unknown"; DISPLAY_NAME="Unknown"

          if [ -f "$INFO_PLIST" ]; then
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST" 2>/dev/null || echo "Unknown")
            VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST" 2>/dev/null || echo "Unknown")
            BUILD_NUM=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST" 2>/dev/null || echo "Unknown")
            DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$INFO_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$INFO_PLIST" 2>/dev/null || echo "Unknown")
          fi

          echo "Packaging .ipa..."
          cd "$STAGE_DIR"
          zip -r9 -y "$OUTPUT_IPA" Payload

          echo "Validating ZIP integrity..."
          unzip -t "$OUTPUT_IPA"

          if ! unzip -l "$OUTPUT_IPA" | grep -E "Payload/[^/]+\.app/Info\.plist" >/dev/null; then
            echo "::error::Integrity check failed: Payload/*.app/Info.plist missing from generated IPA."
            exit 1
          fi

          SHA256=$(shasum -a 256 "$OUTPUT_IPA" | awk '{print $1}')
          IPA_SIZE=$(stat -f %z "$OUTPUT_IPA" 2>/dev/null || wc -c < "$OUTPUT_IPA")
          CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg requestId "$REQUEST_ID" \
            --arg scheme "$SCHEME" \
            --arg configuration "$CONFIG" \
            --arg bundleIdentifier "$BUNDLE_ID" \
            --arg displayName "$DISPLAY_NAME" \
            --arg version "$VERSION" \
            --arg buildNumber "$BUILD_NUM" \
            --arg sha256 "$SHA256" \
            --argjson sizeBytes "$IPA_SIZE" \
            --arg createdAt "$CREATED_AT" \
            --arg runner "$RUNNER_LABEL" \
            '{requestId: $requestId, scheme: $scheme, configuration: $configuration, bundleIdentifier: $bundleIdentifier, displayName: $displayName, version: $version, buildNumber: $buildNumber, sha256: $sha256, sizeBytes: $sizeBytes, createdAt: $createdAt, runner: $runner}' \
            > "$RUNNER_TEMP/build-info.json"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "ipa_path=$OUTPUT_IPA" >> "$GITHUB_OUTPUT"

      - name: Capture Failure Diagnostics
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          ERRORS=""
          ERROR_CAT="CODE_AND_BUILD_ERROR"
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            if grep -q "\[PROJECT_ERROR\]" "$RUNNER_TEMP/build.log"; then
              ERROR_CAT="PROJECT_ERROR"
            fi
            ERRORS=$(grep -E "(\.(swift|m|mm|c|cpp|h|xib|storyboard|plist|xcassets)[^:]*:[0-9]*:?[0-9]*: (error|fatal error):|^error:|xcodebuild: error:|clang: error:|ld: |::error::)" "$RUNNER_TEMP/build.log" \
              | sed "s|$RUNNER_TEMP/workspace/||g" | sed "s|::error::||g" | sed "s|\[PROJECT_ERROR\] ||g" | awk '!seen[$0]++' | tail -n 40 || true)
          fi
          jq -n \
            --arg status "failed" \
            --arg errorCategory "$ERROR_CAT" \
            --arg compilerErrors "$ERRORS" \
            '{status: $status, errorCategory: $errorCategory, compilerErrors: $compilerErrors}' > "$RUNNER_TEMP/build-info.json"

      - name: Upload Build Artifacts & Logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudipa-artifact-${{ inputs.request_id }}
          path: |
            ${{ runner.temp }}/*.ipa
            ${{ runner.temp }}/build-info.json
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
